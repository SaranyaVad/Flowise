name: Deploy Return to India app to GitHub Pages

on:
    push:
        branches:
            - claude/india-return-info-app-kutwjo
        paths:
            - 'packages/india-return-app/**'
            - '.github/workflows/deploy-india-return-app.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Install dependencies
              working-directory: packages/india-return-app
              run: pnpm install --ignore-workspace
            - name: Build
              working-directory: packages/india-return-app
              run: pnpm build
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/india-return-app/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
